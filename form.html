<!DOCTYPE html>
<html>
<head>
    <title>Assignment 4 Form</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        font-size: 16px;
        background-color: white;
        margin: 40px;
    }

    form {
        text-align: left;
        width: 400px;
    }

    label {
        display: block;
        margin-top: 10px;
    }

    input, select {
        margin-top: 5px;
        padding: 5px;
        font-size: 16px;
        width: 250px;
    }

    button {
        margin-top: 15px;
        padding: 6px 12px;
        font-size: 16px;
    }

    .msg {
        font-weight: bold;
        margin-left: 5px;
        display: inline-block;
    }

    .error {
        color: red;
    }

    .warning {
        color: orange;
    }
</style>


</head>
<body>

<h2>COMP 322 – Assignment 4</h2>

<form id="userForm">

    <label id="userLabel">Username: <span class="msg"></span></label>
    <input type="text" id="username"><br><br>

    <label id="emailLabel">Email: <span class="msg"></span></label>
    <input type="text" id="email"><br><br>

    <label id="phoneLabel">Phone Number: <span class="msg"></span></label>
    <input type="text" id="phone"><br><br>

    <label id="passLabel">Enter Password: <span class="msg"></span></label>
    <input type="password" id="password"><br><br>

    <label id="confirmLabel">Confirm Password: <span class="msg"></span></label>
    <input type="password" id="confirm"><br><br>

   <label id="genderLabel">Gender: <span class="msg"></span></label>
    <input type="radio" name="gender" value="Female"> Female<br>
    <input type="radio" name="gender" value="Male"> Male<br>
    <input type="radio" name="gender" value="Other"> Other<br><br>

    <label id="ageLabel">Age Group: <span class="msg"></span></label>
    <select id="age">
        <option value="">(blank)</option>
        <option value="<21">< 21 years old</option>
        <option value="21-25">21 - 25 years old</option>
        <option value="26-35">26 - 35 years old</option>
        <option value="36-50">36 - 50 years old</option>
        <option value="50+">50 years old</option>
    </select><br><br>

    <label>Favorite Music Genre:</label><br>
    <input type="checkbox" value="Pop"> Pop<br>
    <input type="checkbox" value="Hip-hop"> Hip-hop<br>
    <input type="checkbox" value="Jazz"> Jazz<br>
    <input type="checkbox" value="Rock"> Rock<br>
    <input type="checkbox" value="Classical"> Classical Music<br>
    <input type="checkbox" value="Country"> Country<br><br>

    <button type="button" onclick="validateForm()">Submit</button>
    <button type="reset" onclick="clearWarnings()">Clear</button>

</form>

<script src="validation.js"></script>
<a href="index.html">Back to Index</a>
</body>
</html>
